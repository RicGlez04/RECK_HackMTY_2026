<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parrafo A · RECK</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* ================= FICHA DEL ELEMENTO =================
   Categoria : Parrafos
   Hermana   : A
   -- Los 4 rasgos FIJOS (no cambian entre hermanas) --
   1) Color      : etiqueta en var(--accent), cuerpo de texto en var(--text)
   2) Forma      : bloque de ancho maximo controlado, alineado a la izquierda, con etiqueta corta arriba
   3) Proposito  : alojar texto descriptivo de apoyo (cuerpo)
   4) Estructura : section.rk-paragraph > span.rk-paragraph__label + p.rk-paragraph__text
   -- Lo AJUSTABLE entre hermanas --
   - Proporciones: variables --rk-* definidas en la regla
     raiz del componente (abajo). Cambialas para crear
     una nueva variante sin tocar el resto del CSS.
   - Contenido: todo lo marcado data-slot="..." es 100%
     intercambiable siempre que respete el proposito.
   ========================================================= */

.rk-paragraph{
  --rk-paragraph-width: 560px;
  --rk-paragraph-size: 16px;
  max-width:var(--rk-paragraph-width);text-align:left;font-family:var(--rk-sans);
}
.rk-paragraph__label{
  display:block;font-family:var(--rk-mono);font-size:12px;color:var(--accent);
  margin-bottom:var(--rk-space-2);
}
.rk-paragraph__text{
  margin:0;font-size:var(--rk-paragraph-size);line-height:1.6;color:var(--text);
}
</style>
</head>
<body class="rk-preview">
<span class="rk-preview__tag">Parrafos &middot; hermana A</span>
<!-- COMPONENT START -->
<section class="rk-paragraph">
  <span class="rk-paragraph__label" data-slot="label">Sobre el modelo</span>
  <p class="rk-paragraph__text" data-slot="body">
    La simulacion representa una casilla del INE con agentes que llegan,
    forman fila y son atendidos. Cada corrida permite ajustar el numero
    de funcionarios y observar el efecto sobre el tiempo de espera.
  </p>
</section>
<!-- COMPONENT END -->

</body>
</html>
