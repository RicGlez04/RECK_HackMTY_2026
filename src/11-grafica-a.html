<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grafica A · RECK</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* ================= FICHA DEL ELEMENTO =================
   Categoria : Graficas
   Hermana   : A
   -- Los 4 rasgos FIJOS (no cambian entre hermanas) --
   1) Color      : barras en var(--accent-bg)/var(--accent-border), texto en var(--text)
   2) Forma      : barras verticales sobre una linea base, con valor arriba y etiqueta abajo
   3) Proposito  : comparar visualmente valores numericos entre categorias
   4) Estructura : section.rk-chart > h3.rk-chart__title + ul.rk-chart__bars(li) + div.rk-chart__labels
   -- Lo AJUSTABLE entre hermanas --
   - Proporciones: variables --rk-* definidas en la regla
     raiz del componente (abajo). Cambialas para crear
     una nueva variante sin tocar el resto del CSS.
   - Contenido: todo lo marcado data-slot="..." es 100%
     intercambiable siempre que respete el proposito.
   ========================================================= */

.rk-chart{
  --rk-chart-height: 160px;
  --rk-chart-bar-w: 28px;
  width:min(420px,90vw);text-align:left;font-family:var(--rk-sans);
}
.rk-chart__title{margin:0 0 var(--rk-space-4);font-size:14px;color:var(--text-h);font-weight:500;}
.rk-chart__bars{
  list-style:none;margin:0;padding:0;display:flex;align-items:flex-end;
  gap:var(--rk-space-3);height:var(--rk-chart-height);border-bottom:1px solid var(--border);
}
.rk-chart__bar{
  width:var(--rk-chart-bar-w);height:calc(var(--value) * 1%);
  background:var(--accent-bg);border:1px solid var(--accent-border);
  border-radius:6px 6px 0 0;position:relative;
}
.rk-chart__value{
  position:absolute;top:-20px;left:50%;transform:translateX(-50%);
  font-family:var(--rk-mono);font-size:11px;color:var(--text);white-space:nowrap;
}
.rk-chart__labels{display:flex;gap:var(--rk-space-3);margin-top:var(--rk-space-2);}
.rk-chart__label{width:var(--rk-chart-bar-w);font-size:11px;text-align:center;color:var(--text);}
</style>
</head>
<body class="rk-preview">
<span class="rk-preview__tag">Graficas &middot; hermana A</span>
<!-- COMPONENT START -->
<section class="rk-chart">
  <h3 class="rk-chart__title" data-slot="title">Tiempo de espera promedio (min)</h3>
  <ul class="rk-chart__bars" data-slot="data">
    <li class="rk-chart__bar" style="--value:40"><span class="rk-chart__value">8</span></li>
    <li class="rk-chart__bar" style="--value:65"><span class="rk-chart__value">13</span></li>
    <li class="rk-chart__bar" style="--value:90"><span class="rk-chart__value">18</span></li>
    <li class="rk-chart__bar" style="--value:55"><span class="rk-chart__value">11</span></li>
    <li class="rk-chart__bar" style="--value:30"><span class="rk-chart__value">6</span></li>
  </ul>
  <div class="rk-chart__labels" data-slot="labels">
    <span class="rk-chart__label">9h</span><span class="rk-chart__label">11h</span>
    <span class="rk-chart__label">13h</span><span class="rk-chart__label">15h</span>
    <span class="rk-chart__label">17h</span>
  </div>
</section>
<!-- COMPONENT END -->

</body>
</html>
