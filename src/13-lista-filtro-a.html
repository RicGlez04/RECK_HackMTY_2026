<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista con filtro A · RECK</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* ================= FICHA DEL ELEMENTO =================
   Categoria : Listas con filtros
   Hermana   : A
   -- Los 4 rasgos FIJOS (no cambian entre hermanas) --
   1) Color      : chip activo en var(--accent)/var(--accent-bg), items con borde var(--border)
   2) Forma      : fila de chips filtro arriba + lista vertical de tarjetas abajo
   3) Proposito  : explorar una coleccion de elementos filtrable por categoria
   4) Estructura : section.rk-list-filter > div.rk-list-filter__filters(chips) + ul.rk-list-filter__items(li)
   -- Lo AJUSTABLE entre hermanas --
   - Proporciones: variables --rk-* definidas en la regla
     raiz del componente (abajo). Cambialas para crear
     una nueva variante sin tocar el resto del CSS.
   - Contenido: todo lo marcado data-slot="..." es 100%
     intercambiable siempre que respete el proposito.
   ========================================================= */

.rk-list-filter{width:min(420px,90vw);text-align:left;font-family:var(--rk-sans);}
.rk-list-filter__filters{display:flex;flex-wrap:wrap;gap:var(--rk-space-2);margin-bottom:var(--rk-space-4);}
.rk-chip{
  font-size:13px;color:var(--text);background:var(--code-bg);border:1px solid var(--border);
  border-radius:var(--rk-radius-pill);padding:6px 14px;cursor:pointer;
}
.rk-chip.is-active{color:var(--accent);background:var(--accent-bg);border-color:var(--accent-border);}
.rk-list-filter__items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--rk-space-2);}
.rk-list-filter__item{
  display:flex;justify-content:space-between;gap:var(--rk-space-3);
  padding:var(--rk-space-3);border:1px solid var(--border);border-radius:var(--rk-radius-sm);
  font-size:14px;color:var(--text-h);
}
.rk-list-filter__item[hidden]{display:none;}
.rk-list-filter__tag{font-family:var(--rk-mono);font-size:11px;color:var(--accent);}
</style>
</head>
<body class="rk-preview">
<span class="rk-preview__tag">Listas con filtros &middot; hermana A</span>
<!-- COMPONENT START -->
<section class="rk-list-filter">
  <div class="rk-list-filter__filters" data-slot="filters">
    <button class="rk-chip is-active" data-filter="todos">Todos</button>
    <button class="rk-chip" data-filter="alerta">Alerta</button>
    <button class="rk-chip" data-filter="ok">Ok</button>
  </div>
  <ul class="rk-list-filter__items" data-slot="items">
    <li class="rk-list-filter__item" data-tags="alerta">Fila 1 <span class="rk-list-filter__tag">ALERTA</span></li>
    <li class="rk-list-filter__item" data-tags="ok">Fila 2 <span class="rk-list-filter__tag">OK</span></li>
    <li class="rk-list-filter__item" data-tags="ok">Fila 3 <span class="rk-list-filter__tag">OK</span></li>
    <li class="rk-list-filter__item" data-tags="alerta">Fila 4 <span class="rk-list-filter__tag">ALERTA</span></li>
  </ul>
</section>
<!-- COMPONENT END -->
<script>
(function(){
  document.querySelectorAll('.rk-list-filter').forEach(function(box){
    var chips = box.querySelectorAll('.rk-chip');
    var items = box.querySelectorAll('.rk-list-filter__item');
    chips.forEach(function(chip){
      chip.addEventListener('click', function(){
        chips.forEach(function(c){ c.classList.remove('is-active'); });
        chip.classList.add('is-active');
        var f = chip.dataset.filter;
        items.forEach(function(item){
          var tags = (item.dataset.tags || '').split(',');
          item.hidden = f !== 'todos' && tags.indexOf(f) === -1;
        });
      });
    });
  });
})();
</script>
</body>
</html>
